# Test that the packed package installs cleanly with React 18 and React 19
name: Test install

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  install-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react-version: ['18', '19']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build and pack package
        run: |
          bun install
          bun run build
          bun run package
          mv nebulr-group-bridge-react-*.tgz install-test-pkg.tgz

      # TBP-665 — the main entry and `/flags` must share one flag registry in
      # the BUILT output (a per-entry build gave each its own copy).
      - name: Built dist shares one flag registry
        run: cd bridge-react && bun test ./test-dist/shared-registry.dist.tsx

      - name: Install with React ${{ matrix.react-version }}
        run: |
          mkdir -p install-test
          cd install-test
          npm init -y
          npm install react@^${{ matrix.react-version }} react-dom@^${{ matrix.react-version }}
          npm install ../install-test-pkg.tgz
          echo "Install with react@${{ matrix.react-version }} succeeded"

      - name: Installed package shares one flag registry (ESM + CJS)
        working-directory: install-test
        run: |
          cat > check.mjs <<'EOF'
          import { createRequire } from 'node:module';
          const require = createRequire(import.meta.url);
          const inst = { flag: () => ({ passed: true, value: true }) };
          const mainEsm = await import('@nebulr-group/bridge-react');
          const flagsEsm = await import('@nebulr-group/bridge-react/flags');
          mainEsm.setBridgeFlagsInstance(inst);
          const mainCjs = require('@nebulr-group/bridge-react');
          const flagsCjs = require('@nebulr-group/bridge-react/flags');
          mainCjs.setBridgeFlagsInstance(inst);
          const ok = flagsEsm.getBridgeFlagsInstance() === inst && flagsCjs.getBridgeFlagsInstance() === inst;
          console.log(ok ? 'shared registry: ok' : 'shared registry: SPLIT');
          process.exit(ok ? 0 : 1);
          EOF
          node check.mjs
